name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: matviikk

      - name: Pokemon of the day
        run: |
          ID=$((RANDOM % 898 + 1))
          curl -sL "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/$ID.png" -o dist/pokemon.png
          NAME=$(curl -s "https://pokeapi.co/api/v2/pokemon/$ID" | python3 -c "import json,sys; print(json.load(sys.stdin)['name'])")
          printf '{"name":"%s"}' "$NAME" > dist/pokemon.json

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: matviikk

      - run: mv profile-3d-contrib/* dist/

      - uses: Platane/snk@v3
        with:
          github_user_name: matviikk
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
